# Heap for the Gradle daemon. Trimmed from -Xmx8G / MaxMetaspaceSize=4G: this
# module's Kotlin input is a single 5-line MainActivity.kt, and the Gradle daemon,
# the Kotlin daemon and the AAPT2 daemon are separate JVMs — over-reserving here
# creates memory pressure that itself destabilises the Kotlin daemon.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# DISABLE KOTLIN INCREMENTAL COMPILATION.
#
# Why: the project lives on D:\ while the pub cache lives on
# C:\Users\<user>\AppData\Local\Pub\Cache. Kotlin's incremental caches store
# source paths RELATIVE to the module dir (RelocatableFileToPathConverter ->
# File.relativeTo). On Windows, relativizing across two different drive letters
# throws:
#
#   java.lang.IllegalArgumentException: this and base files have different roots:
#     C:\...\Pub\Cache\hosted\pub.dev\mobile_scanner-7.2.0\...\BarcodeHandler.kt
#     and D:\...\fih-verifier\android
#
# which surfaces as "Could not close incremental caches in ...\caches-jvm\..."
# and "e: Daemon compilation failed: null" for every plugin that ships Kotlin
# (mobile_scanner, shared_preferences_android, audioplayers_android). Gradle then
# retries out-of-process, so the APK is still produced — the errors are loud but
# not fatal. Turning IC off means IncrementalCachesManager is never constructed,
# so there is no cache to relativize or close, and the errors disappear at the
# source instead of being suppressed.
#
# Cost: none here. The only first-party Kotlin is MainActivity.kt; plugin Kotlin
# is compiled once per clean build either way.
#
# Alternative (not applied — machine-wide, and re-downloads every package): set
# the PUB_CACHE env var to a directory on D:\ so the sources and the build
# outputs share a root.
kotlin.incremental=false

# android.enableJetifier removed: deprecated under AGP 8.x and unnecessary —
# nothing in this dependency tree is a pre-AndroidX (support-library) artifact.
# It forced a bytecode-rewrite pass over every artifact on every build.
